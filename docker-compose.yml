services:
  app:
    build:
      context: .
      args:
        # Only NEXT_PUBLIC_* vars need to cross into the image at build time
        # (see Dockerfile) — read from the shell/.env by compose's own
        # variable substitution, separate from the env_file below.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the .env value so the SQLite file lives on the persistent
      # "app-data" volume below, not inside the container's writable layer.
      - DATABASE_URL=file:/data/formation.db
    volumes:
      - app-data:/data
      - uploads:/app/public/uploads
    expose:
      - "3300"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - APEX_DOMAIN=${APEX_DOMAIN}
      - VAULT_DOMAIN=${VAULT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      # Vault (a separate app/repo/container on this VM) has no Caddy of its own — this joins
      # its compose project's external network so this Caddy can reach "vault-app" by name.
      # Create once with: docker network create esports-tools-shared
      - esports-tools-shared
    depends_on:
      - app

networks:
  esports-tools-shared:
    external: true

volumes:
  app-data:
  uploads:
  caddy-data:
  caddy-config:
