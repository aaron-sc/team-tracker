services:
  app:
    build:
      context: .
      args:
        # Only NEXT_PUBLIC_* vars need to cross into the image at build time
        # (see Dockerfile) — read from the shell/.env by compose's own
        # variable substitution, separate from the env_file below.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides the .env value so the SQLite file lives on the persistent
      # "app-data" volume below, not inside the container's writable layer.
      - DATABASE_URL=file:/data/formation.db
    volumes:
      - app-data:/data
      - uploads:/app/public/uploads
    expose:
      - "3300"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - APEX_DOMAIN=${APEX_DOMAIN}
      - VAULT_DOMAIN=${VAULT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default: {}
      # Vault/hub (separate apps/repos/containers on this VM) have no Caddy of their own — this
      # joins their compose projects' external network so this Caddy can reach "vault-app"/
      # "hub-app" by name. Create once with: docker network create esports-tools-shared
      #
      # The aliases below make this Caddy ALSO answer to its own public hostnames on this network
      # — so when Vault's or hub's container looks up formation.esports-tools.com (for the
      # server-to-server leg of the OIDC dance), Docker's embedded DNS resolves it to this
      # container instead of doing a real lookup out to Cloudflare. Caddy then reverse-proxies it
      # to "app" exactly as it does for real browser traffic, presenting the same real cert, so
      # TLS validation on the caller's end still succeeds — the request just never leaves the VM,
      # which is what actually matters: Cloudflare's bot protection was blocking these
      # machine-to-machine calls (a JS challenge a non-browser can never solve). See the OIDC
      # broker plan for why this route was chosen over pointing those calls at "app:3300" directly
      # (that would drop TLS, which is the only thing actually authenticating the token issuer in
      # this Auth.js version — jwks-based signature verification isn't performed for this flow).
      esports-tools-shared:
        aliases:
          - formation.esports-tools.com
          - esports-tools.com
    depends_on:
      - app

networks:
  esports-tools-shared:
    external: true

volumes:
  app-data:
  uploads:
  caddy-data:
  caddy-config:
